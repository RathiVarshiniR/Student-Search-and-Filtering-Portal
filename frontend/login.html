<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Registrar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />

<style>
  .password-wrap {
    position: relative;
    width: 100%;
  }

  .password-wrap input {
    width: 100%;
    padding-right: 44px;
  }

  .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    background: transparent;
    color: #6b7280;
    opacity: 0.55;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .password-toggle:hover {
    opacity: 0.9;
  }

  .password-toggle:focus {
    outline: none;
  }

  .eye-icon {
    width: 19px;
    height: 19px;
  }
</style>
</head>

<body class="auth-body">

  <div class="auth-shell">

    <div class="auth-mark">
      <span class="auth-mark-glyph">§</span>
      <div>
        <p class="auth-brand">Registrar</p>
        <p class="auth-tagline">Student records, in order.</p>
      </div>
    </div>

    <form class="auth-card" id="loginForm" autocomplete="on">

      <h1>Sign in</h1>

      <p class="auth-sub">
        Enter your credentials to open the student register.
      </p>

      <label class="field">
        <span>Username</span>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          required
        />
      </label>

      <label class="field">
        <span>Password</span>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
            aria-label="Show password"
            title="Show password"
          >
            <svg
              class="eye-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
            </svg>
          </button>

        </div>
      </label>

      <p class="auth-error" id="authError" hidden></p>

      <button
        type="submit"
        class="btn-primary"
        id="loginBtn"
      >
        Sign in
      </button>

    </form>

    <p class="auth-footnote">
      Access is limited to registered staff accounts.
    </p>

  </div>

  <script src="login.js"></script>

  <script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');

    passwordToggle.addEventListener('click', () => {
      const showingPassword = passwordInput.type === 'text';

      passwordInput.type = showingPassword ? 'password' : 'text';

      passwordToggle.setAttribute(
        'aria-label',
        showingPassword ? 'Show password' : 'Hide password'
      );

      passwordToggle.setAttribute(
        'title',
        showingPassword ? 'Show password' : 'Hide password'
      );

      passwordToggle.innerHTML = showingPassword
        ? `
          <svg
            class="eye-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
          </svg>
        `
        : `
          <svg
            class="eye-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 3l18 18"></path>
            <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.4 18.4 0 0 1-3.1 3.7"></path>
            <path d="M6.1 6.1C3.4 8 2 12 2 12s3.5 6 10 6c1.4 0 2.6-.3 3.7-.7"></path>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
          </svg>
        `;
    });
  </script>

</body>
</html>
