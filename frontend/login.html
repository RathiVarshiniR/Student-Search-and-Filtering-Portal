<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Registrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-mark">
      <span class="auth-mark-glyph">§</span>
      <div>
        <p class="auth-brand">Registrar</p>
        <p class="auth-tagline">Student records, in order.</p>
      </div>
    </div>

    <form class="auth-card" id="loginForm" autocomplete="on">
      <h1>Sign in</h1>
      <p class="auth-sub">Enter your credentials to open the student register.</p>

      <label class="field">
        <span>Username</span>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </label>

      <p class="auth-error" id="authError" hidden></p>

      <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
    </form>

    <p class="auth-footnote">Access is limited to registered staff accounts.</p>
  </div>

  <script src="login.js"></script>
</body>
</html>
